# GitLab CI — 与 .github/workflows/ci.yml（GitHub Actions）行为对等
# 课程要求（§五.6）：必须包含一个名为 unit-test 的 job。
# §4.8：每次 push 自动运行测试；项目选容器分发，CI 中构建镜像。

stages:
  - test
  - build

cache:
  key: npm
  paths:
    - ~/.npm

unit-test:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm test

webui-client:
  stage: test
  image: node:20
  script:
    - cd src/webui/client
    - npm ci
    - npm test
    - npm run build

desktop:
  stage: test
  image: node:20
  script:
    - cd desktop
    - npm ci
    - npm test
    - npx tsc --noEmit

docker-build:
  stage: build
  # NJU GitLab 共享 runner 无特权容器——docker:27-dind 无法启动（实测 2026-08-06：
  # mount: permission denied + AppArmor/--privileged 警告 → dockerd 未监听 2375 →
  # docker build 报 Cannot connect to the Docker daemon）。
  # kaniko 是 daemonless 镜像构建（GitLab 官方推荐的 dind 替代），无需特权容器。
  # gcr.io 官方镜像在 NJU 网络拉取超时（实测 2026-08-06：context deadline exceeded）
  # → 用 DaoCloud 代理。注意 docker.m.daocloud.io 只代理 docker.io（实测拉
  #   docker.m.daocloud.io/gcr.io/kaniko-project/executor 返回 invalid repository,
  #   source docker.io）——GCR 要换专用端点 gcr.m.daocloud.io（本地实测 token
  #   握手后 manifest 200 可达）。
  # entrypoint: [""] 必需——executor 镜像 ENTRYPOINT 是 /kaniko/executor，GitLab
  #   用 sh -c 包装脚本会变成 `executor sh` → unknown command（实测 2026-08-06）；
  #   用 :debug 标签（含 busybox sh，GitLab 官方文档同款组合）。
  image:
    name: gcr.m.daocloud.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    # 多阶段构建自包含（镜像内完成 tsc + WebUI client 构建）
    # --registry-mirror：kaniko 绕过 daemon 自拉 Docker Hub 被 NJU 网络拦截（实测
    #   index.docker.io i/o timeout；runner 宿主 daemon 能拉 node:20 是宿主自己配了
    #   镜像站）→ 走镜像站，且必须是「完整代理」（blob 由镜像站伺服）：
    #   docker.m.daocloud.io 实测 blob 重定向 production.cloudfront.docker.com 被
    #   reset；m.daocloud.io 带 token 仍 403（要账号）；1panel.live 本机可用但
    #   runner 容器挂起；1ms.run blob 走自家 CloudFront CDN（校园网有 reset
    #   CloudFront IP 的前科，风险）。本机网络与 runner 网络不同，候选按
    #   busybox wget 15s 探测连通性循环选择：docker.nju.edu.cn（校内镜像站，
    #   本机 403=nginx 限校内 IP；宿主大概率就是用它）→ docker.1ms.run →
    #   docker.1panel.live。仅影响本 job——Dockerfile 保持规范 FROM，
    #   GitHub Actions/本地构建不受影响。
    - |
      for M in docker.nju.edu.cn docker.1ms.run docker.1panel.live; do
        echo "== probe $M =="
        if wget -S -q --timeout=15 -O /dev/null "https://$M/v2/library/node/manifests/20.19.4-alpine3.22" 2>&1 | grep -q "HTTP/"; then
          echo "== $M reachable from runner; kaniko --registry-mirror=$M =="
          if /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --no-push --registry-mirror="$M"; then
            exit 0
          else
            echo "== kaniko failed with $M (exit $?) =="
          fi
        else
          echo "== $M unreachable from runner =="
        fi
      done
      echo "== all mirrors failed =="
      exit 1
  # 说明：kaniko 无 daemon，无法 docker run 验证（--version/--help/start --web 断言
  # 由 GitHub Actions 的 docker-build job 承担，见 .github/workflows/ci.yml——GitHub
  # runner 原生支持 docker executor，两平台分工：GitLab 验证镜像可构建，GitHub 验证运行行为。
