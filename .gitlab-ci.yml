# GitLab CI — 与 .github/workflows/ci.yml（GitHub Actions）行为对等
# 课程要求（§五.6）：必须包含一个名为 unit-test 的 job。
# §4.8：每次 push 自动运行测试；项目选容器分发，CI 中构建镜像。

stages:
  - test
  - build

cache:
  key: npm
  paths:
    - ~/.npm

unit-test:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm test

webui-client:
  stage: test
  image: node:20
  script:
    - cd src/webui/client
    - npm ci
    - npm test
    - npm run build

desktop:
  stage: test
  image: node:20
  script:
    - cd desktop
    - npm ci
    - npm test
    - npx tsc --noEmit

docker-build:
  stage: build
  # NJU GitLab 共享 runner 无特权容器——docker:27-dind 无法启动（实测 2026-08-06：
  # mount: permission denied + AppArmor/--privileged 警告 → dockerd 未监听 2375 →
  # docker build 报 Cannot connect to the Docker daemon）。
  # kaniko 是 daemonless 镜像构建（GitLab 官方推荐的 dind 替代），无需特权容器。
  # gcr.io 官方镜像在 NJU 网络拉取超时（实测 2026-08-06：context deadline exceeded）
  # → 用 DaoCloud 代理。注意 docker.m.daocloud.io 只代理 docker.io（实测拉
  #   docker.m.daocloud.io/gcr.io/kaniko-project/executor 返回 invalid repository,
  #   source docker.io）——GCR 要换专用端点 gcr.m.daocloud.io（本地实测 token
  #   握手后 manifest 200 可达）。
  # entrypoint: [""] 必需——executor 镜像 ENTRYPOINT 是 /kaniko/executor，GitLab
  #   用 sh -c 包装脚本会变成 `executor sh` → unknown command（实测 2026-08-06）；
  #   用 :debug 标签（含 busybox sh，GitLab 官方文档同款组合）。
  image:
    name: gcr.m.daocloud.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    # 多阶段构建自包含（镜像内完成 tsc + WebUI client 构建）
    # --registry-mirror：kaniko 绕过 daemon 自拉 Docker Hub 被 NJU 网络拦截（实测
    #   Get https://index.docker.io/v2/: dial tcp i/o timeout；runner 宿主 daemon
    #   能拉 node:20 是因宿主配了自己的镜像站）→ 走镜像站。注意镜像站必须是
    #   「完整代理」：docker.m.daocloud.io 的 blob 下载会重定向到
    #   production.cloudfront.docker.com，被 NJU 网络 reset（实测 2026-08-06）。
    #   docker.1panel.live 实测 blob 由自身域名伺服（200）且 node:20.19.4-alpine3.22
    #   存在（另一候选 docker.xuanyuan.me 同测通过但 429 限流，弃用）。
    #   仅影响本 job——Dockerfile 保持规范 FROM，GitHub Actions/本地构建不受影响。
    - /kaniko/executor --context "${CI_PROJECT_DIR}" --dockerfile "${CI_PROJECT_DIR}/Dockerfile" --no-push --registry-mirror=docker.1panel.live
  # 说明：kaniko 无 daemon，无法 docker run 验证（--version/--help/start --web 断言
  # 由 GitHub Actions 的 docker-build job 承担，见 .github/workflows/ci.yml——GitHub
  # runner 原生支持 docker executor，两平台分工：GitLab 验证镜像可构建，GitHub 验证运行行为。
