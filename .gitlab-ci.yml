# GitLab CI — 与 .github/workflows/ci.yml（GitHub Actions）行为对等
# 课程要求（§五.6）：必须包含一个名为 unit-test 的 job。
# §4.8：每次 push 自动运行测试；项目选容器分发，CI 中构建镜像。

stages:
  - test
  - build

cache:
  key: npm
  paths:
    - ~/.npm

unit-test:
  stage: test
  image: node:22
  script:
    - npm ci
    - npm test

webui-client:
  stage: test
  image: node:20
  script:
    - cd src/webui/client
    - npm ci
    - npm test
    - npm run build

desktop:
  stage: test
  image: node:20
  script:
    - cd desktop
    - npm ci
    - npm test
    - npx tsc --noEmit

docker-build:
  stage: build
  # 镜像构建逻辑等价验证（2026-08-06 定稿）。
  # 为什么不是真实构建镜像——共享 runner 实测结论（逐条验证过）：
  #   1. 无特权容器 → docker:27-dind 无法启动（mount permission denied）→ 无法
  #      docker build；无 docker socket，也无法借宿主 daemon。
  #   2. kaniko（daemonless，GitLab 官方推荐的 dind 替代）可运行，但 base 镜像
  #      拉取被校园网拦截：index.docker.io i/o timeout；镜像站候选——docker.m
  #      .daocloud.io blob 重定向 production.cloudfront.docker.com 被 reset、
  #      m.daocloud.io 带 token 仍 403（要账号）、1panel.live 与 docker.nju.edu.cn
  #      从 runner 连接挂起（busybox wget --timeout 不生效，job 卡满 1h 超时）、
  #      1ms.run blob CDN 为 Cloudflare IP 段（未验证）。
  #  结论：该 runner 环境在无特权 + 屏蔽 Docker Hub/CloudFront 的双重约束下无法
  #  真实构建 Docker 镜像。本 job 退化为「Dockerfile 构建步骤等价验证」——在
  #  node 镜像中执行与 Dockerfile build 阶段完全相同的步骤并断言产物；
  #  真实镜像构建 + 运行断言（--version/--help/start --web）由 GitHub Actions 的
  #  docker-build job 承担（§4.8「CI 构建镜像」在 GitHub 侧完整满足，
  #  见 .github/workflows/ci.yml）。
  image: node:22
  script:
    # 与 Dockerfile build 阶段逐条对应：
    #   FROM node:20.19.4-alpine3.22 AS build → npm ci --ignore-scripts
    #   → npm run build（tsc → dist/）→ cd src/webui/client && npm ci && npm run
    #   build（vite → src/webui/client/dist）。
    # 注意：client 在仓库根下第 3 级，回根必须 cd ../../..（../.. 只回到 src/；
    # 2026-08-06 首跑实测：test -f dist/cli/index.js 在 src/ 下查不到文件，exit 1）。
    - npm ci --ignore-scripts
    - npm run build
    - cd src/webui/client && npm ci && npm run build && cd ../../..
    # 断言产物存在（与 runtime 阶段 COPY --from=build 的路径一致——容器内
    # ENTRYPOINT node dist/cli/index.js，start --web 依赖 client/dist）。
    - test -f dist/cli/index.js
    - test -f src/webui/client/dist/index.html
