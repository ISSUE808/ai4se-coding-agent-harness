name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TODO: 根据你的技术栈调整以下步骤
      # 示例为 Node.js/TypeScript，如用其他语言请替换

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # 如需构建分发产物（Docker 镜像、二进制等），在这里添加步骤
      # - name: Build Docker image
      #   run: docker build -t ai4se-harness .
